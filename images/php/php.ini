xdebug.mode=debug,coverage
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9043
xdebug.idekey = PHPSTORM

memory_limit = 1024M

; grpc is already enabled by the base image (docker-php-ext-grpc.ini) — do not re-declare
; `extension=grpc.so` here, it only produces a "Module already loaded" warning.
;
; Verbosity/trace default to quiet: gRPC's native logging runs on every PHP process in this
; container (phpcs, phpunit, composer — not just code that opens a channel), so a debug-level
; default means every command pays a large log dump. For an actual gRPC-level debugging session,
; override per-invocation instead of raising these defaults:
;   docker exec -e GRPC_VERBOSITY=debug -e GRPC_TRACE=all tinkoff_invest_sdk_php /bin/bash -c "..."
grpc.grpc_verbosity=error
grpc.grpc_trace=
grpc.log_filename=/var/logs/grpc.log